services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: time_deposits
      POSTGRES_USER: ${DB_USERNAME:-time_deposits}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-time_deposits}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
